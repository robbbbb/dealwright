# Local dev only (Card 0: local Postgres + Django dev server; Railway plugin in prod).
# Credentials are local-only placeholders — production values live in Railway config.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dealwright
      POSTGRES_USER: dealwright
      POSTGRES_PASSWORD: dealwright
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealwright"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://dealwright:dealwright@db:5432/dealwright
    volumes:
      - .:/app
      - venv:/app/.venv   # keep the image's prod deps; don't shadow with host .venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  venv:
