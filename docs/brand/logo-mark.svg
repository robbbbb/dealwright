<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Dealwright monogram — DW">
  <!--
    Dealwright logo mark: elegant "DW" monogram — thin weight, wide tracking,
    flat gold field. No bars, no depth edge, no ornaments.
    PRODUCTION NOTE: the DW is a live <text> element on the system font stack.
    Rendering varies by OS (thin weights fall back to regular on some Linux
    stacks) and PDF exporters may substitute fonts. Before production use,
    replace the <text> with an outlined <path> version, optically centered at
    (32, 32), then re-verify the tracking against the drawn letterforms.
  -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#B79121"/>
  <!-- x is shifted +1.5 (half the letter-spacing) so the monogram stays optically centered -->
  <text x="33.5" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="300" font-size="28" letter-spacing="3" fill="#FFFFFF">DW</text>
</svg>
