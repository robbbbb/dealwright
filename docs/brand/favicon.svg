<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Dealwright favicon — DW crossed by peso bars">
  <!--
    Dealwright favicon: flatter small-size variant - no depth edge, full-bleed
    square, compact DW + peso bars so the composition stays legible at 16px.
    PRODUCTION NOTE: the DW is a live <text> element on the system font stack.
    Replace it with an outlined <path> before production use.
  -->
  <rect width="32" height="32" rx="8" fill="#B79121"/>
  <text x="16" y="16.5" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="800" font-size="15" letter-spacing="-0.5" fill="#FFFFFF">DW</text>
  <rect x="7" y="12" width="18" height="2" rx="0.5" fill="#9C7B1C"/>
  <rect x="7" y="17" width="18" height="2" rx="0.5" fill="#9C7B1C"/>
</svg>
