<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Dealwright favicon — DW">
  <!--
    Dealwright favicon: same elegant DW monogram, tuned for tiny sizes —
    slightly sturdier size so the thin strokes stay visible at 16px.
    PRODUCTION NOTE: replace the <text> with an outlined <path> before
    production use.
  -->
  <rect width="32" height="32" rx="8" fill="#B79121"/>
  <text x="17" y="16.5" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="300" font-size="14" letter-spacing="1.5" fill="#FFFFFF">DW</text>
</svg>
