# Local dev Postgres only (Card 0: local Postgres in dev; Railway plugin in prod).
# Credentials are local-only placeholders — production values live in Railway config.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dealwright
      POSTGRES_USER: dealwright
      POSTGRES_PASSWORD: dealwright
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealwright"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
