[project]
name = "dealwright"
version = "0.1.0"
description = "Discovery-call notes → deterministic ROI estimates, service recommendations, VA matches, and client-ready proposals."
readme = "README.md"
authors = [{ name = "robbbbb", email = "robertojr.rodriguez1993@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
    # The mfa extra = qrcode (TOTP QR SVG) + fido2 (hard import from allauth.mfa.stages
    # even with WebAuthn disabled — verified; do not "tidy" it away).
    "django-allauth[mfa,socialaccount]>=65.19.4",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
testpaths = ["core", "team"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]  # autogenerated files — never hand-edited

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
