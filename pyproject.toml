[project]
name = "dealwright"
version = "0.1.0"
description = "Discovery-call notes → deterministic ROI estimates, service recommendations, VA matches, and client-ready proposals."
readme = "README.md"
authors = [{ name = "robbbbb", email = "robertojr.rodriguez1993@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
    "django-allauth[socialaccount]>=65.19.4",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dealwright.settings.testing"
testpaths = ["core"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
