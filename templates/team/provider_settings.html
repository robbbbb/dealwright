{% extends "app-base.html" %}
{% block title %}Settings — Dealwright{% endblock %}
{% block app_content %}
<div class="mx-auto max-w-[560px]">
  <a href="{% url 'home' %}" class="text-[12px] font-bold text-dw-700 no-underline hover:underline">← Back to dashboard</a>
  <h1 class="mt-2 mb-1 text-[21px] font-extrabold leading-tight text-dw-ink">Settings</h1>
  <p class="mb-4 text-[12px] text-dw-muted">How you deliver — proposals and matching read these.</p>

  <div class="card">
    <form method="post" class="m-0">
      {% csrf_token %}
      {% include "team/_form_fields.html" %}
      <button type="submit" class="btn-primary">Save settings</button>
    </form>
  </div>
</div>
{% endblock %}
