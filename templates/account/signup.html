{% extends "base.html" %}
{% block title %}Create account · Dealwright{% endblock %}
{% block content %}
  <section class="card mx-auto mt-12 max-w-[420px]">
    <h1 class="text-xl font-bold text-dw-ink">Create your account</h1>
    <p class="mb-4 text-dw-muted">Sign up with your email — no username needed.</p>
    <form method="post" action="{% url 'account_signup' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">Create account</button>
    </form>
    <p class="alt-link">Already registered? <a href="{% url 'account_login' %}">Sign in</a></p>
  </section>
{% endblock %}
