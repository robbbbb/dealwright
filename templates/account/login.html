{% extends "base.html" %}
{% block title %}Sign in · Dealwright{% endblock %}
{% block content %}
  <section class="card mx-auto mt-12 max-w-[420px]">
    <h1 class="text-xl font-bold text-dw-ink">Sign in</h1>
    <p class="mb-4 text-dw-muted">Welcome back. Enter your email and password.</p>
    <form method="post" action="{% url 'account_login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
    <p class="alt-link">No account yet? <a href="{% url 'account_signup' %}">Create one</a></p>
    <p class="alt-link"><a href="{% url 'account_reset_password' %}">Forgot your password?</a></p>
  </section>
{% endblock %}
