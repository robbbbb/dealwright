{% extends "base.html" %}
{% block title %}Sign in · Dealwright{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>Sign in</h1>
    <p class="muted">Welcome back. Enter your email and password.</p>
    <form method="post" action="{% url 'account_login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn primary wide">Sign in</button>
    </form>
    <p class="alt">No account yet? <a href="{% url 'account_signup' %}">Create one</a></p>
    <p class="alt"><a href="{% url 'account_reset_password' %}">Forgot your password?</a></p>
  </section>
{% endblock %}
